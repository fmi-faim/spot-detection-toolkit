[project]
dependencies = [
    "pandas>=3.1.1,<4",
    "tifffile>=2026.11.16,<2027",
    "scipy>=1.18.1,<2",
    "matplotlib>=3.11.2,<4",
    "numpy>=2.5.5,<3",
    "pyyaml>=6.0.3,<7",
    "scikit-image>=0.26.0,<0.27",
]
name = "spot-detection-toolkit"
requires-python = ">= 3.12"
version = "0.1.0"

[project.optional-dependencies]
piscis = ["piscis>=1.1.0,<2"]
ufish = ["ufish>=0.1.1,<0.2"]
spotiflow = ["spotiflow>=0.6.5,<0.7"]

[project.scripts]
run_inference = "spot_detection_toolkit.run_inference:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64","linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
spot_detection_toolkit = { path = ".", editable = true }

[tool.pixi.dependencies]
python = "<3.15"
pandas = ">=3.1.1,<4"
tifffile = ">=2026.11.16,<2027"
scipy = ">=1.18.1,<2"
numpy = ">=2.5.5,<3"
matplotlib = ">=3.11.2,<4"
pyyaml = ">=6.0.3,<7"
scikit-image = ">=0.26.0,<0.27"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
piscis = { features = ["piscis"], solve-group = "default" }
ufish = { features = ["ufish"], solve-group = "default" }
spotiflow = { features = ["spotiflow"], solve-group = "default" }
all = { features = ["piscis", "ufish", "spotiflow"], solve-group = "default" }
test-piscis = { features = ["test", "piscis"], solve-group = "default" }
test-ufish = { features = ["test", "ufish"], solve-group = "default" }
test-spotiflow = { features = ["test", "spotiflow"], solve-group = "default" }
test-all = { features = ["test", "piscis", "ufish", "spotiflow"], solve-group = "default" }
jupyter = { features = ["jupyter"], solve-group = "default" }
napari = { features = ["napari"], solve-group = "default" }

[tool.pixi.feature.piscis.dependencies]
piscis = ">=1.1.0,<2"

[tool.pixi.feature.ufish.dependencies]
ufish = ">=0.1.1,<0.2"

[tool.pixi.feature.spotiflow.dependencies]
pytorch = ">=2.14.1,<3"

[tool.pixi.feature.test.dependencies]
pytest = ">=9.2.0,<10"
pytest-cov = ">=7.1.0,<8"

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.feature.jupyter.dependencies]
jupyter = ">=1.1.1,<2"

[tool.pixi.feature.napari.dependencies]
napari = ">=0.7.0,<0.8"
pyqt6 = ">=6.11.0,<7"

[dependency-groups]
spotiflow = ["spotiflow>=0.6.5,<0.7"]
